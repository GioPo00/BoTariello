# THE JOB THAT REGENERATES THE PRICE LIST
#
# This repository contains no data: it contains a scheduled job that rebuilds
# the price list every quarter of an hour and publishes it on the `dati` branch.
#
#   ramo dati  ->  listino-console.json, listino-pc.json, stato.json
#
# Consumers read the published files straight from raw.githubusercontent.com.
#
# ── WHY A BRANCH REBUILT FROM SCRATCH EVERY TIME ───────────────────────────
#
# The price list weighs about 130 KB per platform and changes on every run.
# Keeping its history would mean growing the repository by a few tens of MB a
# day, forever, for a history nobody reads. The `dati` branch is therefore
# REWRITTEN on every run: one commit, always the same size.
#
# ── WHY ONE LONG RUN INSTEAD OF ONE RUN EVERY FIFTEEN MINUTES ──────────────
#
# GitHub's own "every 15 minutes" cron does not fire every 15 minutes: it
# fires when it can, i.e. every 3-6 hours (measured on 2026-10-16: 04:32,
# 09:32, 14:44, 18:58). A single run is therefore kept alive for almost six
# hours (GitHub's maximum) and regenerates the list on its own every quarter
# of an hour. When GitHub starts the next run the previous one is cancelled
# (`cancel-in-progress`) and the new one carries on: the list stays fresh
# without gaps. The repository is public, so the minutes cost nothing.

name: listino

# Publish on the `dati` branch, and restart this same job (see below).
permissions:
  contents: write
  actions: write

concurrency:
  group: listino
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  costruisci:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild the price list every quarter hour, for almost six hours
        run: |
          inizio=$(date +%s)
          giro=0
          # 22 rounds of 15 minutes = 5 and a half hours, under the 6 hour cap.
          while [ $giro -lt 22 ]; do
            giro=$((giro + 1))
            partenza=$(date +%s)
            echo "── round $giro ($(date -u +%H:%M:%SZ))"
            rm -rf listino
            if node costruisci-listino.mjs listino; then
              (
                set -e
                cd listino
                git init -q
                git config user.name  "listino"
                git config user.email "listino@users.noreply.github.com"
                git add -A
                git commit -q -m "listino $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                git push -q --force                   "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"                   HEAD:dati
              ) && cat listino/stato.json || echo "publish failed, retrying on the next round"
            else
              echo "source did not answer, retrying on the next round"
            fi
            # One extra round only if there is still time to run it whole.
            [ $(( $(date +%s) - inizio )) -gt $((5 * 3600 + 20 * 60)) ] && break
            attesa=$(( 900 - ( $(date +%s) - partenza ) ))
            [ $attesa -gt 0 ] && sleep $attesa
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── AND WHEN IT ENDS, OR IS KILLED, IT STARTS AGAIN BY ITSELF ────────
      #
      # A job killed half way through used to leave the prices frozen for
      # hours, until the next cron fired. Now the job starts another one as
      # soon as it finishes, is killed, or is cancelled. Not when it is
      # "cancelled": that means another one has already started, and a third
      # would only pile up.
      - name: Restart the price list job
        if: ${{ !cancelled() }}
        run: gh workflow run listino.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
