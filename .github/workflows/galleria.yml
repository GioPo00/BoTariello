# THE JOB THAT REBUILDS THE GALLERY CATALOGUE
#
# Every 3 hours it re-reads the full album catalogue from the source and
# publishes `catalogo-fc27.json` on the `galleria` branch.
#
# A branch of its own, because `dati` is rebuilt from scratch every quarter
# of an hour by the price list job.

name: galleria

on:
  schedule:
    # Every 3 hours, at :20, well away from the quarter hour of the price
    # list job.
    - cron: '20 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galleria
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read every album from the source
        run: node tools/gallery/scarica.mjs

      - name: Build the catalogue
        run: |
          mkdir -p galleria
          node tools/gallery/genera.mjs --json galleria/catalogo-fc27.json

      - name: Check that it is sound
        run: node tools/gallery/controlla-catalogo.mjs galleria/catalogo-fc27.json

      - name: Publish on the galleria branch
        run: |
          set -e
          cd galleria
          git init -q
          git config user.name  "galleria"
          git config user.email "galleria@users.noreply.github.com"
          git add -A
          git commit -q -m "catalogo $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:galleria
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
